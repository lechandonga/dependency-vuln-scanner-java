server.port=0
# ===== 依赖漏洞扫描服务配置 =====
# 本地漏洞库目录（仅读取，不联网）
scanner.library-dir=data/vulnerability-db
# 按文件名提交时允许访问的清单根目录（content 直传不受限）
scanner.manifest-dir=data/manifests
# 清单/漏洞库存在解析问题时是否整体拒绝
scanner.reject-on-issue=true
# 任务结果保留时长（秒）
scanner.task-ttl-seconds=3600
# 内存任务表上限
scanner.max-tasks=10000
# 相同清单内容重复提交时是否复用既有任务
scanner.dedupe-same-content=true
